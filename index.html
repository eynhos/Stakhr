    <script>
    // نام اختصاصی برای جلوگیری از تداخل (این را تغییر ندهید)
    const NAMESPACE = 'stakhr_ir_2026_private';
    const KEY = 'unique_visitors';

    // ثبت بازدیدکننده جدید در سرور
    if (!sessionStorage.getItem('has_visited')) {
      fetch(`https://abacus.jasoncameron.dev/hit/${NAMESPACE}/${KEY}`)
      .then(res => res.json())
      .then(data => {
        sessionStorage.setItem('has_visited', 'true');
        sessionStorage.setItem('total_visitors', data.value);
        })
      .catch(() => {});
      }

      // تابع نمایش/مخفی کردن آمار (فقط با میانبر)
      function toggleVisits() {
        const textSite = document.getElementById('text-site');
        const numVisits = document.getElementById('num-visits');

        // اگر کلمه سایت دیده می‌شود
        if (textSite.style.display !== 'none') {
          textSite.style.display = 'none';
          numVisits.style.display = 'inline';

          // گرفتن آمار از سرور
          fetch(`https://abacus.jasoncameron.dev/get/${NAMESPACE}/${KEY}`)
          .then(res => res.json())
          .then(data => {
            numVisits.innerText = data.value;
            })
          .catch(() => {
            numVisits.innerText = 'خطا';
            });
          } else {
            // برگرداندن به حالت اول
            textSite.style.display = 'inline';
            numVisits.style.display = 'none';
            }
          }

          // میانبر کلیدهای Shift + M
          document.addEventListener('keydown', function(e) {
            if (e.shiftKey && (e.key === 'M' || e.key === 'm' || e.key === 'پ')) {
              toggleVisits();
              }
            });
            </script>

  <!-- ===== اسکریپت تغییر رنگ مستطیل ===== -->
  <script>
    function changeCardColor(color, btn) {
      const root = document.documentElement;
      
      // حذف حالت فعال از همه دکمه‌ها
      document.querySelectorAll('.color-switcher button').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');

      if (color === 'dark') {
        root.style.setProperty('--surface', 'rgba(15, 15, 15, .55)');
        root.style.setProperty('--border', 'rgba(255, 255, 255, .15)');
      } else if (color === 'teal') {
        root.style.setProperty('--surface', 'rgba(6, 52, 62, .55)'); /* شیشه آبی نفتی */
        root.style.setProperty('--border', 'rgba(80, 235, 225, .38)');
      } else if (color === 'gold') {
        root.style.setProperty('--surface', 'rgba(155, 0, 0, .55)'); /* شیشه طلایی */
        root.style.setProperty('--border', 'rgba(255, 196, 70, .38)');
      } else if (color === 'orange') {
        root.style.setProperty('--surface', 'rgba(51, 30, 10, .55)'); /* شیشه نارنجی */
        root.style.setProperty('--border', 'rgba(255, 150, 60, .38)');
      } else if (color === 'blue') {
        root.style.setProperty('--surface', 'rgba(10, 35, 55, .55)'); /* شیشه سرمه‌ای */
        root.style.setProperty('--border', 'rgba(100, 200, 255, .38)');
      }
    }
  </script>
